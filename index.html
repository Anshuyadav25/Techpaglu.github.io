<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Progress Tracker</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #1d2939;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 32rem),
        linear-gradient(135deg, #eef4ff 0%, #f8fafc 50%, #eefdf7 100%);
    }

    main {
      width: min(100%, 760px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      padding: clamp(24px, 5vw, 48px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #0f172a;
    }

    p {
      margin: 0 0 28px;
      color: #475467;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #344054;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 18px;
      font: inherit;
      line-height: 1.6;
      color: #101828;
      background: #ffffff;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 4px solid rgba(37, 99, 235, 0.24);
      outline-offset: 2px;
    }

    #saveButton {
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
    }

    #saveButton:hover {
      background: #1d4ed8;
    }

    #loadButton {
      color: #1d2939;
      background: #e2e8f0;
    }

    #loadButton:hover {
      background: #cbd5e1;
    }

    #status {
      min-height: 28px;
      margin-top: 18px;
      color: #2563eb;
      font-weight: 700;
    }

    #status.error {
      color: #dc2626;
    }

    #status.success {
      color: #15803d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Personal Progress Tracker</h1>
    <p>Write your latest progress below, save it to Firestore, and load it back whenever you return to this page.</p>

    <label for="progressText">Your progress</label>
    <textarea id="progressText" placeholder="Type your personal progress here..."></textarea>

    <div class="actions">
      <button id="saveButton" type="button">Save Progress</button>
      <button id="loadButton" type="button">Load Progress</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBtlw3vawzgciFlMJBsmMJcYIA_KT5QKU",
      authDomain: "techpaglu-e5a1d.firebaseapp.com",
      projectId: "techpaglu-e5a1d",
      storageBucket: "techpaglu-e5a1d.firebasestorage.app",
      messagingSenderId: "932355291634",
      appId: "1:932355291634:web:4f703b9ec01087f877d36b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const progressRef = doc(db, "data", "personalProgress");

    const progressText = document.getElementById("progressText");
    const saveButton = document.getElementById("saveButton");
    const loadButton = document.getElementById("loadButton");
    const status = document.getElementById("status");

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    async function saveProgress() {
      setStatus("Saving...");

      try {
        await setDoc(progressRef, {
          progress: progressText.value,
          updatedAt: new Date().toISOString()
        });

        setStatus("Saved successfully!", "success");
      } catch (error) {
        console.error("Error saving progress:", error);
        setStatus("Unable to save progress. Check the console for details.", "error");
      }
    }

    async function loadProgress() {
      setStatus("Loading progress...");

      try {
        const snapshot = await getDoc(progressRef);

        if (snapshot.exists()) {
          progressText.value = snapshot.data().progress || "";
          setStatus("Progress loaded successfully!", "success");
        } else {
          setStatus("No saved progress found yet.");
        }
      } catch (error) {
        console.error("Error loading progress:", error);
        setStatus("Unable to load progress. Check the console for details.", "error");
      }
    }

    saveButton.addEventListener("click", saveProgress);
    loadButton.addEventListener("click", loadProgress);
    window.addEventListener("DOMContentLoaded", loadProgress);
  </script>
</body>
</html>
